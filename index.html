<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHIN ORNE by CHARM AURA | Handcrafted Beads &amp; Jewelry</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Shin Orne by Charm Aura: handcrafted beads and timeless jewelry. Shop necklaces, bracelets, earrings and bead sets." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#090705" />
    <script>
      // Apply the saved (or default dark) theme before first paint so the page never flashes the wrong one.
      try {
        var t = localStorage.getItem('shinorne-theme');
        if (t !== 'light') document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SHIN ORNE by CHARM AURA" />
    <meta property="og:title" content="SHIN ORNE by CHARM AURA | Handcrafted Beads &amp; Jewelry" />
    <meta property="og:description" content="Handcrafted beads and timeless jewelry designed to illuminate your unique aura." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&q=80&w=1200" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <div id="root"><!--app-html--></div>
